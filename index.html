<script>
(function(){

async function open_(pw){

  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

}
function show(r){document.open();document.write(r.html);document.close();}
var f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");

});
